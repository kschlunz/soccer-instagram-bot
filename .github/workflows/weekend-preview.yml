name: Weekend preview

on:
  schedule:
    # Friday 21:00 UTC = 5:00 PM New York (4:00 PM during standard time).
    - cron: "0 21 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, do not post to Instagram"
        type: boolean
        default: false
      date:
        description: "Pretend today is this date (YYYY-MM-DD); the preview covers the following Sat/Sun"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekend-preview
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1   # the two profiles push to the same images branch
      matrix:
        include:
          - profile: soccer
            user_secret: IG_USER_ID
            token_secret: IG_ACCESS_TOKEN
            handle_var: IG_HANDLE
            hashtags_var: HASHTAGS
            competitions_var: COMPETITIONS
          - profile: womens
            user_secret: IG_USER_ID_WOMENS
            token_secret: IG_ACCESS_TOKEN_WOMENS
            handle_var: IG_HANDLE_WOMENS
            hashtags_var: HASHTAGS_WOMENS
            competitions_var: COMPETITIONS_WOMENS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render and post (${{ matrix.profile }})
        env:
          PROFILE: ${{ matrix.profile }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          IG_USER_ID: ${{ secrets[matrix.user_secret] }}
          IG_ACCESS_TOKEN: ${{ secrets[matrix.token_secret] }}
          IG_API_BASE: ${{ vars.IG_API_BASE }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/New_York' }}
          TIME_FORMAT: ${{ vars.TIME_FORMAT || '12h' }}
          TZ_LABEL: ${{ vars.TZ_LABEL }}
          COMPETITIONS: ${{ vars[matrix.competitions_var] }}
          POST_WHEN_EMPTY: 'false'
          ESPN_ENRICH: ${{ vars.ESPN_ENRICH || 'true' }}
          POST_STORIES: ${{ vars.POST_STORIES || 'true' }}
          STORY_MAX: ${{ vars.STORY_MAX || '3' }}
          HASHTAGS: ${{ vars[matrix.hashtags_var] }}
          IG_HANDLE: ${{ vars[matrix.handle_var] }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS="--mode weekend"
          if [ -n "$INPUT_DATE" ]; then ARGS="$ARGS --date $INPUT_DATE"; fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$IG_HANDLE" ]; then ARGS="$ARGS --handle $IG_HANDLE"; fi
          python -m bot.main $ARGS

      - name: Upload rendered images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekend-${{ matrix.profile }}-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
