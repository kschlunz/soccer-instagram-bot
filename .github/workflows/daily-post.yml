name: Daily matchday post

on:
  schedule:
    # 11:00 UTC every day = 07:00 New York (06:00 during standard time). Adjust to taste.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to post (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
      dry_run:
        description: "Render only, do not post to Instagram"
        type: boolean
        default: false

permissions:
  contents: write   # needed to push the rendered images to the images branch

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Render and post
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_BASE: ${{ vars.IG_API_BASE }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/New_York' }}
          TIME_FORMAT: ${{ vars.TIME_FORMAT || '12h' }}
          TZ_LABEL: ${{ vars.TZ_LABEL }}
          COMPETITIONS: ${{ vars.COMPETITIONS }}
          POST_WHEN_EMPTY: ${{ vars.POST_WHEN_EMPTY || 'false' }}
          HASHTAGS: ${{ vars.HASHTAGS || '#soccer #football #matchday #fixtures #futbol' }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$IG_HANDLE" ]; then ARGS="$ARGS --handle $IG_HANDLE"; fi
          python -m bot.main $ARGS

      - name: Upload rendered images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchday-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
