name: Refresh Instagram token

on:
  schedule:
    # October 31, 12:00 UTC: day 58 of the token generated on 2026-09-03.
    # Each refresh resets the 60-day expiry, so move this date after regenerating the token.
    - cron: "0 12 31 10 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # to open a reminder issue when automatic refresh is not configured

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: soccer
            secret_name: IG_ACCESS_TOKEN
          - account: womens
            secret_name: IG_ACCESS_TOKEN_WOMENS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check configuration
        id: cfg
        env:
          HAS_PAT: ${{ secrets.SECRETS_PAT != '' }}
          HAS_TOKEN: ${{ secrets[matrix.secret_name] != '' }}
        run: |
          echo "has_pat=$HAS_PAT" >> "$GITHUB_OUTPUT"
          echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Refresh token with Instagram
        if: steps.cfg.outputs.has_pat == 'true' && steps.cfg.outputs.has_token == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets[matrix.secret_name] }}
          IG_API_BASE: ${{ vars.IG_API_BASE }}
        run: python -m bot.refresh_token --out "$RUNNER_TEMP/new_token"

      - name: Store the refreshed token back into the secret
        if: steps.cfg.outputs.has_pat == 'true' && steps.cfg.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          SECRET_NAME: ${{ matrix.secret_name }}
        run: |
          NEW_TOKEN="$(cat "$RUNNER_TEMP/new_token")"
          echo "::add-mask::$NEW_TOKEN"
          gh secret set "$SECRET_NAME" --repo "$GITHUB_REPOSITORY" --body "$NEW_TOKEN"
          rm -f "$RUNNER_TEMP/new_token"
          echo "$SECRET_NAME secret updated."

      - name: Open a reminder issue instead
        if: steps.cfg.outputs.has_pat != 'true' && steps.cfg.outputs.has_token == 'true' && matrix.account == 'soccer'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Refresh the Instagram access token"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "Reminder issue already open."; exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$(cat <<'BODY'
          Automatic refresh is not configured (no SECRETS_PAT secret), so this is a reminder.

          Instagram access tokens expire 60 days after they were generated or last refreshed.
          Either regenerate the token in the Meta developer dashboard and update the
          IG_ACCESS_TOKEN secret, or add a SECRETS_PAT secret so this workflow refreshes it
          automatically every week. See README.md, "Token refresh".
          BODY
          )"
